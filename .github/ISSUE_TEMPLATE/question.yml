name: Question
description: Ask for help using qm-feishu
title: "[Question]: "
labels: ["type:question"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose credentials, tenant identifiers, message data, or attachment data. Security vulnerabilities must be reported privately using the Security vulnerability link below, not in this form.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe what you are trying to do with synthetic, non-sensitive details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State what you expected qm-feishu to do.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, tenant identifiers, message data, and attachment data from this question.
          required: true
        - label: This is not a security vulnerability; security reports use the private advisory link.
          required: true
