name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and release evidence
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ! grep -q 'PENDING' docs/live-test-runbook.md
          ! grep -q '\[ \]' docs/live-test-runbook.md
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yc-software/qm
          ref: 7f2c916360f1797a8ff2a77ce2ce40c5fabab087
          path: qm-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qm-reference/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: qm-reference
      - name: Run pinned QM source-auth contract
        env:
          QM_CONTRACT_BASE_URL: http://127.0.0.1:18080
          QM_CONTRACT_SIGNING_SECRET: qm-feishu-contract-secret-00000001
        run: |
          test "$(git -C qm-reference rev-parse --short=7 HEAD)" = "7f2c916"
          PORT=18080 \
          CORE_SIGNING_SECRET="$QM_CONTRACT_SIGNING_SECRET" \
          HARNESS=mock \
          HARNESS_SECURITY_POSTURE=dangerous \
          BACKGROUND_WORK_ENABLED=0 \
          SEED_SKILLS=0 \
          DATA_DIR="$RUNNER_TEMP/qm-contract" \
            npm --prefix qm-reference start >"$RUNNER_TEMP/qm-contract.log" 2>&1 &
          qm_pid=$!
          trap 'kill "$qm_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$QM_CONTRACT_BASE_URL/healthz" >/dev/null; then
              npm run test:qm-contract
              exit
            fi
            if ! kill -0 "$qm_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/qm-contract.log"
          exit 1


  publish:
    needs: [verify, qm-contract]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/luw2007/qm-feishu:${{ needs.verify.outputs.version }}
            ghcr.io/luw2007/qm-feishu:${{ github.sha }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Container: ghcr.io/luw2007/qm-feishu:${{ needs.verify.outputs.version }}@${IMAGE_DIGEST}" \
            docs/compatibility.md docs/live-test-runbook.md
