name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and release evidence
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ! grep -q 'PENDING' docs/03-workflows/release-verification.md
          ! grep -q '\[ \]' docs/03-workflows/release-verification.md
      - run: npm ci
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yc-software/qm
          ref: 7f2c916360f1797a8ff2a77ce2ce40c5fabab087
          path: qm-reference
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qm-reference/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: qm-reference
      - name: Run pinned QM source-auth contract
        env:
          QM_CONTRACT_BASE_URL: http://127.0.0.1:18080
          QM_CONTRACT_SIGNING_SECRET: qm-feishu-contract-secret-00000001
        run: |
          test "$(git -C qm-reference rev-parse --short=7 HEAD)" = "7f2c916"
          PORT=18080 \
          CORE_SIGNING_SECRET="$QM_CONTRACT_SIGNING_SECRET" \
          HARNESS=mock \
          HARNESS_SECURITY_POSTURE=dangerous \
          BACKGROUND_WORK_ENABLED=1 \
          SEED_SKILLS=0 \
          DATA_DIR="$RUNNER_TEMP/qm-contract" \
            npm --prefix qm-reference start >"$RUNNER_TEMP/qm-contract.log" 2>&1 &
          qm_pid=$!
          trap 'kill "$qm_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$QM_CONTRACT_BASE_URL/healthz" >/dev/null; then
              npm run test:qm-contract
              exit
            fi
            if ! kill -0 "$qm_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/qm-contract.log"
          exit 1


  publish:
    needs: [verify, qm-contract]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate image once
        run: docker build -t qm-feishu:candidate .
      - name: Inspect candidate image
        run: |
          test "$(docker run --rm qm-feishu:candidate node -e 'console.log(process.getuid())')" != "0"
          docker create --name qm-feishu-inspect qm-feishu:candidate
          docker export qm-feishu-inspect | tar -tf - > "$RUNNER_TEMP/image-files.txt"
          docker rm -f qm-feishu-inspect
          grep -q '^app/dist/main.js$' "$RUNNER_TEMP/image-files.txt"
          grep -q '^app/package.json$' "$RUNNER_TEMP/image-files.txt"
          grep -q '^app/LICENSE$' "$RUNNER_TEMP/image-files.txt"
          ! grep -E '^app/(src|test|docs|fixtures)/' "$RUNNER_TEMP/image-files.txt"
          ! grep -E '^app/\.env($|\.)' "$RUNNER_TEMP/image-files.txt"
      - name: Smoke candidate lifecycle
        run: |
          docker run -d --name qm-feishu-smoke \
            -e CORE_API_URL=http://127.0.0.1:18080 \
            -e CORE_SIGNING_SECRET=release-only-synthetic-secret-00000001 \
            -e FEISHU_APP_ID=cli_release_test_app \
            -e FEISHU_APP_SECRET=release-only-synthetic-app-secret \
            -e FEISHU_BOT_OPEN_ID=ou_release_test_bot \
            -e FEISHU_TENANT_KEY=tenant_release_test \
            -e CORE_REQUEST_TIMEOUT_MS=100 \
            -p 3000:3000 qm-feishu:candidate
          trap 'docker rm -f qm-feishu-smoke 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            curl -fsS http://127.0.0.1:3000/healthz && break
            test "$attempt" != "15"
            sleep 2
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/readyz)" = "503"
          docker stop --time 20 qm-feishu-smoke
          test "$(docker inspect qm-feishu-smoke --format '{{.State.ExitCode}}')" = "0"
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: qm-feishu:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push verified candidate
        id: image
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          version_tag="ghcr.io/luw2007/qm-feishu:${VERSION}"
          sha_tag="ghcr.io/luw2007/qm-feishu:${GITHUB_SHA}"
          docker tag qm-feishu:candidate "$version_tag"
          docker tag qm-feishu:candidate "$sha_tag"
          docker push "$version_tag"
          docker push "$sha_tag"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$version_tag" | cut -d@ -f2)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Container: ghcr.io/luw2007/qm-feishu:${{ needs.verify.outputs.version }}@${IMAGE_DIGEST}" \
            docs/01-architecture/compatibility.md docs/03-workflows/release-verification.md
