name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify public dependency provenance
        run: |
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          ! grep -E '"resolved": "https?://' package-lock.json | grep -v 'https://registry.npmjs.org/'
      - run: npm ci
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yc-software/qm
          ref: 7f2c916360f1797a8ff2a77ce2ce40c5fabab087
          path: qm-reference
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qm-reference/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: qm-reference
      - name: Run pinned QM source-auth contract
        env:
          QM_CONTRACT_BASE_URL: http://127.0.0.1:18080
          QM_CONTRACT_SIGNING_SECRET: qm-feishu-contract-secret-00000001
        run: |
          test "$(git -C qm-reference rev-parse --short=7 HEAD)" = "7f2c916"
          PORT=18080 \
          CORE_SIGNING_SECRET="$QM_CONTRACT_SIGNING_SECRET" \
          HARNESS=mock \
          HARNESS_SECURITY_POSTURE=dangerous \
          BACKGROUND_WORK_ENABLED=1 \
          SEED_SKILLS=0 \
          DATA_DIR="$RUNNER_TEMP/qm-contract" \
            npm --prefix qm-reference start >"$RUNNER_TEMP/qm-contract.log" 2>&1 &
          qm_pid=$!
          trap 'kill "$qm_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$QM_CONTRACT_BASE_URL/healthz" >/dev/null; then
              npm run test:qm-contract
              exit
            fi
            if ! kill -0 "$qm_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/qm-contract.log"
          exit 1

